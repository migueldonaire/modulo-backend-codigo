services:
  # Kafka: el bus de eventos. Modo KRaft: no necesita Zookeeper
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092" # para los servicios que arrancas en tu ordenador
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # hace de broker y de controlador
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Dos "puertas": kafka:19092 para los contenedores, localhost:9092 para tu ordenador
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Solo hay un broker: cada dato se guarda una vez
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3 # cada topic nuevo nace con 3 particiones
    healthcheck: # "Kafka está listo" cuando responde a esta orden
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      retries: 20

  # Panel web para ver topics, mensajes y grupos: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bootcamp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  # --- A partir de aquí: la parte final de la clase (todo en Docker) ---

  # Crea el topic y termina (lo mismo que hicimos a mano)
  kafka-init:
    image: apache/kafka:4.2.0
    command: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic order-created --partitions 3
    depends_on:
      kafka:
        condition: service_healthy # espera a que Kafka esté listo

  books-service:
    build: ./books-service # construye la imagen con su Dockerfile
    environment:
      KAFKA_BROKER: kafka:19092 # dentro de Docker, Kafka se llama "kafka"
    depends_on:
      kafka-init:
        condition: service_completed_successfully # cuando el topic ya existe

  orders-service:
    build: ./orders-service
    environment:
      BOOKS_HOST: books-service # el nombre del servicio es su dirección
      KAFKA_BROKER: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  notifications-service:
    build: ./notifications-service
    environment:
      KAFKA_BROKER: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # El único que se ve desde fuera: la puerta de entrada
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      BOOKS_HOST: books-service
      ORDERS_HOST: orders-service
    depends_on:
      - books-service
      - orders-service
