# CI del repositorio: comprueba que los proyectos de Express pasan el lint
# y los tipos. Cada carpeta tiene además su propio .github/workflows/ci.yml,
# que funciona cuando copias esa carpeta como repositorio independiente.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  express:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [02-express-memoria, 02b-express-mongodb]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Comprobar tipos
        run: npm run typecheck
